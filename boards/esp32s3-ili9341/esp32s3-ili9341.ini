; PlatformIO Project Configuration File
; Kaito ESP32-S3 N16R8 + ILI9341 2.8" TFT + XPT2046 Touch  (Bruce custom build)
;
; Shared HSPI bus:  SCLK=12, MOSI=11, MISO=13
; TFT:              CS=4, DC=5, RST=6, BL=38
; Touch (XPT2046):  CS=7, IRQ=16   (shares HSPI)
; SD Card:          CS=17          (shares HSPI)
; CC1101 SubGHz:    CS=18, GDO0=39 (shares HSPI)
; nRF24 #1:         CS=10, CE=14   (shares HSPI)   <-- stock Bruce supports ONLY 1 nRF24
; IR:               TX=8, RX=48
; GPS/UART:         TX=43, RX=44   (console is on USB-CDC, so these are free)
; Buttons ladder:   ADC=3   | Battery sense: ADC=9   (need custom code, see notes)

[env:esp32s3-ili9341]
board = esp32s3
board_build.partitions = custom_16Mb.csv
board_build.arduino.memory_type = qio_opi   ; N16R8 octal PSRAM
board_upload.flash_size = 16MB
build_src_filter =${env.build_src_filter} +<../boards/esp32s3-ili9341>
build_flags =
	${env.build_flags}
	-Iboards/esp32s3-ili9341

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT

	; ==================== Feature gates ====================
	-DUSB_as_HID=1
	-DHAS_TOUCH=1
	-DTOUCH_CTRL_XPT2046=1
	-DHAS_RESISTIVE_TOUCH=1

	; ==================== TFT_eSPI (ILI9341 240x320) ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DILI9341_DRIVER=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_INVERSION_ON
	-DTFT_CS=4
	-DTFT_DC=5
	-DTFT_RST=6
	-DTFT_BL=38
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_MISO=13
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_XPT2046_SPI=1
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=16

	; ==================== Buttons / IR ====================
	-DBTN_ALIAS='"OK"'
	-DIR_TX_PINS='{{"IR", 8}}'
	-DIR_RX_PINS='{{"IR", 48}}'
	-DRF_TX_PINS='{{"CC1101", 1}}'
	-DRF_RX_PINS='{{"CC1101", 1}}'

	-DROTATION=0
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=11
	-DXPT2046_SPI_BUS_MISO_IO_NUM=13
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=12
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=7
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

	-DDEVICE_NAME='"Kaito S3 Multitool"'

lib_deps =
	${env.lib_deps}
